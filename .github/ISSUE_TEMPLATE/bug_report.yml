name: Bug report
description: Something in Kdacity is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        If the same problem happens in official Audacity 4, it is an upstream bug — please
        report it to [audacity/audacity](https://github.com/audacity/audacity/issues) as well,
        and mention that here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Step-by-step instructions. Please reduce them as far as you can — the shortest sequence
        that still shows the bug is the most useful one.
      placeholder: |
        1. Open Kdacity
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kdacity version
      description: Shown in Help → About Kdacity, or on the splash screen.
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: "Installer from Releases / built from source"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: >-
        On Windows the logs live in `%LOCALAPPDATA%\audacity\Audacity4Development\logs\`.
        Attach or paste the one from the run where the problem happened — it usually names the
        failure directly.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: upstream
    attributes:
      label: Before submitting
      options:
        - label: I checked whether this also happens in official Audacity 4
          required: false
